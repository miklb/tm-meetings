# Cloudflare Pages configuration for Tampa Meetings
name = "tampa-meetings"
# Relative to this file (site/) — running wrangler from site/ makes it bundle
# the adjacent functions/ dir; deploying from the repo root silently drops it.
pages_build_output_dir = "_site"
compatibility_date = "2024-03-01"

[vars]
REGISTRATION_MODE = "PUBLIC"

[[d1_databases]]
binding = "DB"
database_name = "tampa-meetings-notifications"
database_id = "91f3b0f2-dd85-4962-b7dc-1ea4b2ff8c92"
