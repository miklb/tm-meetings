name: Dispatch Keyword Notifications

on:
  workflow_dispatch:
    inputs:
      meeting_ids:
        description: 'Comma-separated meeting IDs to notify on (e.g. "2591,2592")'
        required: true
        type: string
      wordpress_url:
        description: 'WordPress agenda post URL — used as the primary link in notification emails'
        required: false
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dispatch notifications
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          NOTIFICATIONS_API_URL: https://meetings.tampamonitor.com/api/notify
          MEETING_IDS: ${{ inputs.meeting_ids }}
          WORDPRESS_AGENDA_URL: ${{ inputs.wordpress_url }}
        run: node scripts/dispatch-notifications.js
