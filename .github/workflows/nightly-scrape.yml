name: Nightly Agenda Scrape

on:
  schedule:
    # 11 PM UTC (6 PM EST / 7 PM EDT) every day
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One scrape at a time; a manual dispatch during the nightly waits instead of
# racing it to the push.
concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Runs take 8–16 minutes; a hung OnBase fetch must not hold the runner.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agenda-scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: agenda-scraper/package-lock.json

      - name: Install dependencies
        run: npm ci

      # json-scraper.js exits non-zero when ANY meeting failed. That is worth
      # knowing (the issue below reports it) but must not discard the meetings
      # that succeeded: without continue-on-error the commit/push/issue steps
      # were skipped, so one flaky OnBase fetch dropped the whole night.
      - name: Scrape meetings
        id: scrape
        continue-on-error: true
        run: node json-scraper.js 2>&1 | tee /tmp/scrape-output.log; exit ${PIPESTATUS[0]}

      # The Variance Review Board posts to tampa.gov, not OnBase. Collect-only
      # (data/vrb/), a handful of requests a night; a failure here is reported
      # in the issue and never blocks the council data commit.
      - name: Collect VRB agendas
        id: vrb
        continue-on-error: true
        run: node vrb-scraper.js 2>&1 | tee /tmp/vrb-output.log; exit ${PIPESTATUS[0]}

      - name: Check for changes
        id: git-check
        working-directory: .
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --staged --name-only
          fi

      - name: Analyze changes for notifications
        id: analyze
        working-directory: .
        env:
          SCRAPE_LOG: /tmp/scrape-output.log
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          VRB_LOG: /tmp/vrb-output.log
          VRB_OUTCOME: ${{ steps.vrb.outcome }}
          OUT: /tmp/issue-body.md
        run: scripts/nightly-report.sh

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        working-directory: .
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "📋 Agenda data update $(date +%Y-%m-%d)"
          # A push from Michael's machine during the run used to reject ours
          # outright; rebase the data commit onto whatever landed meanwhile.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      # Each notice is a snapshot of one night. Once a newer one exists the
      # older ones are superseded, so after opening tonight's we close every
      # other open notice of ours (matched by author and title). Nothing here
      # may fail the night: the data was committed and pushed above, and
      # tonight's issue is already open by the time the closing loop runs.
      - name: Create notification issue
        if: steps.analyze.outputs.has_meaningful == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          if [[ "${{ steps.scrape.outcome }}" != "success" ]]; then
            TITLE="⚠️ Nightly scrape had failures $(date +%Y-%m-%d)"
          else
            TITLE="📋 Agenda changes detected $(date +%Y-%m-%d)"
          fi
          NEW_URL=$(gh issue create --title "$TITLE" --body-file /tmp/issue-body.md)
          echo "Opened $NEW_URL"
          NEW_NUMBER="${NEW_URL##*/}"
          if [[ ! "$NEW_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::warning::Could not read the new issue number from '$NEW_URL'; leaving older notices open"
            exit 0
          fi
          gh issue list --state open --limit 100 --json number,title,author \
            --jq ".[] | select(.author.login == \"app/github-actions\"
                              and (.title | test(\"Agenda changes detected|Nightly scrape had failures\"))
                              and .number != ${NEW_NUMBER}) | .number" \
            > /tmp/superseded.txt || { echo "::warning::Could not list older notices; leaving them open"; exit 0; }
          while read -r n; do
            [[ -n "$n" ]] || continue
            gh issue close "$n" --reason "not planned" \
              --comment "Superseded by #${NEW_NUMBER}. Each nightly notice is a snapshot; the newest open one is current." \
              && echo "Closed #$n" \
              || echo "::warning::Could not close #$n"
          done < /tmp/superseded.txt
