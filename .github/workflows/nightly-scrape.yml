name: Nightly Agenda Scrape

on:
  schedule:
    # 11 PM UTC (6 PM EST / 7 PM EDT) every day
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One scrape at a time; a manual dispatch during the nightly waits instead of
# racing it to the push.
concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Runs take 8–16 minutes; a hung OnBase fetch must not hold the runner.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agenda-scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: agenda-scraper/package-lock.json

      - name: Install dependencies
        run: npm ci

      # json-scraper.js exits non-zero when ANY meeting failed. That is worth
      # knowing (the issue below reports it) but must not discard the meetings
      # that succeeded: without continue-on-error the commit/push/issue steps
      # were skipped, so one flaky OnBase fetch dropped the whole night.
      - name: Scrape meetings
        id: scrape
        continue-on-error: true
        run: node json-scraper.js 2>&1 | tee /tmp/scrape-output.log; exit ${PIPESTATUS[0]}

      - name: Check for changes
        id: git-check
        working-directory: .
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --staged --name-only
          fi

      - name: Analyze changes for notifications
        id: analyze
        working-directory: .
        env:
          SCRAPE_LOG: /tmp/scrape-output.log
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          OUT: /tmp/issue-body.md
        run: scripts/nightly-report.sh

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        working-directory: .
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "📋 Agenda data update $(date +%Y-%m-%d)"
          # A push from Michael's machine during the run used to reject ours
          # outright; rebase the data commit onto whatever landed meanwhile.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Create notification issue
        if: steps.analyze.outputs.has_meaningful == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          if [[ "${{ steps.scrape.outcome }}" != "success" ]]; then
            TITLE="⚠️ Nightly scrape had failures $(date +%Y-%m-%d)"
          else
            TITLE="📋 Agenda changes detected $(date +%Y-%m-%d)"
          fi
          gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
